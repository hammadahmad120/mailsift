<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #f4f4f4; }
    .btn { background: #0a84ff; color: #fff; padding: 10px; }
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0">
          <tr>
            <td>
              <img src="https://cdn.example.com/logo.png" alt="Example Co logo" width="120">
            </td>
          </tr>
          <tr>
            <td>
              <h1>October product news</h1>
              <p>Three things shipped this month.</p>
              <h3>1. Faster search</h3>
              <p>Search is now twice as fast. <a href="https://example.com/blog/search">Read the post</a>.</p>
              <h3>2. New plans</h3>
              <table border="1" cellpadding="4">
                <tr><th>Plan</th><th>Seats</th><th>Price</th></tr>
                <tr><td>Starter</td><td>5</td><td>$10</td></tr>
                <tr><td>Team</td><td>25</td><td>$40</td></tr>
              </table>
              <p><a class="btn" href="https://example.com/upgrade">Upgrade now</a></p>
            </td>
          </tr>
          <tr>
            <td style="font-size: 11px; color: #888;">
              You received this because you signed up at example.com.
              <a href="https://example.com/unsubscribe?u=123">Unsubscribe</a>
              <img src="https://track.example.com/open.gif" width="1" height="1">
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
